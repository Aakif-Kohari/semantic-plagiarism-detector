[pytest]
pythonpath = .
testpaths = tests
addopts = -v --tb=short --strict-markers --cov=src --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80 -m "not e2e and not slow and not integration"

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require live database or network access
    unit: marks fast, isolated unit tests
    asyncio: marks asynchronous coroutine tests
    e2e: marks Playwright end-to-end tests (Issue #3030)

env =
    MPLBACKEND = Agg

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
